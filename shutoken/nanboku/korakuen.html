<h1><span class="chip" style="background:#00AC9B">N</span>後楽園（N11・南北線）</h1>

<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>目黒方面は<strong>8号車付近</strong></li><li>赤羽岩淵・浦和美園方面は<strong>8号車付近</strong></li></ul>
<p>改札内: ホーム（目黒寄り）～都営線乗換コンコース～春日通り方面改札<br>
改札外: 春日通り方面改札～丸ノ内線・6番出入口<br>
エレベーターのある出入口: 6番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ丸ノ内線（後楽園駅）<br>
徒歩乗り継ぎ: 都営三田線（春日駅）・都営大江戸線（春日駅）</p>
