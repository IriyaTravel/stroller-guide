<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>目黒方面は<strong>8号車付近</strong></li><li>赤羽岩淵・浦和美園方面は<strong>8号車付近</strong></li></ul>
<p>改札内: ホーム（目黒寄り）～市谷八幡方面改札<br>
改札外: 市谷八幡方面改札～エレベーター専用口<br>
エレベーターのある出入口: エレベーター専用口のみ</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ有楽町線（市ケ谷駅）・都営新宿線（市ヶ谷駅）・JR中央・総武線各駅停車（市ケ谷駅）</p>
