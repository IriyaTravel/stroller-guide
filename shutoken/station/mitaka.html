<h1 class="sttitle">三鷹</h1>
<h2>この駅から出発する</h2>
<ul class="rows"><li><a href="../jr-chuo-sobu-local/index.html#JB01"><span class="chip" style="background:#FFD400;color:#1c1a16">JB</span>JR中央・総武線（各駅停車）で出発する</a></li><li><a href="../jr-chuo-rapid/index.html#JC12"><span class="chip" style="background:#F15A22;color:#fff">JC</span>JR中央線（快速）で出発する</a></li></ul>
<h2>この駅で乗る・降りる</h2>
<p>エレベーターに近い号車（方面ごと）</p>
<ul class="plats"><li>JR中央・総武線（各駅停車）：三鷹方面は不明</li><li>JR中央・総武線（各駅停車）：千葉方面は不明</li><li>JR中央線（快速）：高尾方面は<strong>3・4号車付近</strong>（確認中）</li><li>JR中央線（快速）：東京方面は<strong>4号車付近</strong>（確認中）</li></ul>
