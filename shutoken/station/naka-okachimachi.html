<h2>この駅で乗る・降りる</h2>
<p>エレベーターに近い号車（方面ごと）</p>
<ul><li>北千住方面のエレベーターは<strong>4号車付近に到着（乗車時）／4号車付近から出発（降車時）</strong></li><li>中目黒方面のエレベーターは<strong>4号車付近に到着（乗車時）／4号車付近から出発（降車時）</strong></li></ul>
<h2>この駅で乗り換える</h2>
<p>徒歩乗り継ぎ: 都営大江戸線（上野御徒町駅）・JR山手線（御徒町駅）・JR京浜東北線（御徒町駅）・東京メトロ銀座線（末広町駅）・東京メトロ銀座線（上野広小路駅）</p>
