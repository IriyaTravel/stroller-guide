<h1>東府中</h1>

<h2>この駅で乗る・降りる</h2>
<p>エレベーターに近い号車（方面ごと）</p>
<ul><li>京王八王子・高尾山口方面のエレベーターは<strong>3号車付近に到着（乗車時）／3号車付近から出発（降車時）</strong>（確認中）</li><li>新宿方面のエレベーターは<strong>3号車付近に到着（乗車時）／3号車付近から出発（降車時）</strong>（確認中）</li><li>府中競馬正門前方面のエレベーターに近い号車は不明</li></ul>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 競馬場線（東府中駅）・京王線（東府中駅）</p>
