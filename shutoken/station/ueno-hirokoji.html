<h1>上野広小路</h1>
<h2>この駅から出発する</h2>
<ul><li><a href="../ginza/index.html#G15"><span class="chip" style="background:#FF9500">G</span>銀座線で出発する</a></li></ul>
<h2>この駅で乗る・降りる</h2>
<p>エレベーターに近い号車（方面ごと）</p>
<ul><li>渋谷方面のエレベーターは<strong>2号車付近に到着（乗車時）／2号車付近から出発（降車時）</strong></li><li>浅草方面のエレベーターは<strong>1号車付近に到着（乗車時）／1号車付近から出発（降車時）</strong></li></ul>
<h2>この駅で乗り換える</h2>
<p>徒歩乗り継ぎ: 東京メトロ日比谷線（仲御徒町駅）・都営大江戸線（上野御徒町駅）・JR山手線（御徒町駅）・JR京浜東北線（御徒町駅）</p>
