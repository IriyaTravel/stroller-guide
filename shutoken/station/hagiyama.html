<h1>萩山</h1>
<h2>この駅から出発する</h2>
<ul><li><a href="../seibu-haijima/index.html#SS30"><span class="chip" style="background:#007BC1">SS</span>西武拝島線で出発する</a></li><li><a href="../seibu-tamako/index.html#ST04"><span class="chip" style="background:#007BC1">ST</span>西武多摩湖線で出発する</a></li></ul>
<h2>この駅で乗る・降りる</h2>
<p>エレベーターに近い号車（方面ごと）</p>
<ul><li>拝島方面のエレベーターは<strong>9号車付近に到着（乗車時）／9号車付近から出発（降車時）</strong>（確認中）</li><li>小平・西武新宿方面のエレベーターは<strong>2号車付近に到着（乗車時）／2号車付近から出発（降車時）</strong>（確認中）</li><li>多摩湖方面のエレベーターに近い号車は不明</li><li>国分寺方面のエレベーターに近い号車は不明</li></ul>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 西武多摩湖線（萩山駅）・西武拝島線（萩山駅）</p>
