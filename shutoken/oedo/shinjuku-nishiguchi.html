<p>エレベーターで降りるには</p>
<ul><li>都庁前方面は<strong>5号車付近</strong></li><li>飯田橋・春日方面は<strong>5号車付近</strong></li></ul>
<p>改札内: ホーム〜改札<br>

エレベーターのある出入口: D2番出入口</p>
