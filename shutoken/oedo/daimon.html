<h1><span class="chip" style="background:#CE045B">E</span>大門（E20・都営大江戸線）</h1>
<p><a href="index.html#E20">この駅から出発する（経路を組み立てる）</a></p>
<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>両国・春日方面は<strong>5号車付近</strong></li><li>六本木・新宿・光が丘方面は<strong>5号車付近</strong></li></ul>
<p>改札内: ホーム〜改札<br>
改札外: 改札階〜B4出入口／改札階〜B5出入口（日本生命浜松町クレアタワー）<br>
エレベーターのある出入口: B4番出入口・B5番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 都営浅草線（大門駅）<br>
徒歩乗り継ぎ: JR山手線（浜松町駅）・JR京浜東北線（浜松町駅）・東京モノレール羽田空港線（浜松町駅）</p>
