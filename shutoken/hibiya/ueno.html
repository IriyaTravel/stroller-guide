<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>北千住方面は<strong>7号車付近</strong></li><li>中目黒方面は<strong>4号車付近</strong></li></ul>
<p>改札内: 1番線ホーム（中央）～改札階／2番線ホーム（中目黒寄り）～昭和通り南方面改札<br>
改札外: 昭和通り南方面改札階～エレベーター専用口<br>
エレベーターのある出入口: エレベーター専用口のみ</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ銀座線（上野駅）・JR山手線（上野駅）・JR京浜東北線（上野駅）・JR宇都宮線（上野駅）・他<br>
徒歩乗り継ぎ: 京成本線（京成上野駅）</p>
