<ul><li>唐木田方面は<strong>8号車付近</strong></li><li>新百合ヶ丘方面は<strong>8号車付近</strong></li></ul>
<p>改札内: 1・2番線ホーム〜改札階（3F）／3・4番線ホーム〜改札階（3F）／5・6番線ホーム〜改札階（3F）<br>
改札外: 改札階（3F）〜北口（1F）／改札階（3F）〜南口（1F）<br>
エレベーターのある出入口: 北口番出入口・南口番出入口</p>
