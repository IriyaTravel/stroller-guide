<ul><li>新宿方面は<strong>1号車付近</strong></li><li>小田原方面は<strong>1号車付近</strong></li></ul>
<p>改札内: 改札階〜1番線ホーム／改札階〜2番線ホーム<br>

エレベーターのある出入口: 南口番出入口・北口番出入口</p>
