<ul><li>渋谷方面は<strong>6号車付近</strong></li><li>浅草方面は<strong>6号車付近</strong></li></ul>
<p>改札内: ホーム（浅草寄り）～JR上野駅方面改札<br>
改札外: 上野公園方面改札～5a出入口／JR上野駅方面改札～エレベーター専用口7:30～22:00<br>
エレベーターのある出入口: 5a番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ日比谷線（上野駅）・JR山手線（上野駅）・JR京浜東北線（上野駅）・JR宇都宮線（上野駅）・他<br>
徒歩乗り継ぎ: 京成本線（京成上野駅）</p>
