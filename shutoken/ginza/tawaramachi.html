<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>渋谷方面は<strong>1号車付近</strong></li><li>浅草方面は<strong>3号車付近</strong></li></ul>
<p>改札内: なし<br>
改札外: 改札（1番線ホーム）～エレベーター専用口／改札（2番線ホーム）～エレベーター専用口<br>
エレベーターのある出入口: エレベーター専用口のみ</p>
