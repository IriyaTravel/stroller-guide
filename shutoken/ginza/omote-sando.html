<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>渋谷方面は<strong>4号車付近</strong></li><li>浅草方面は<strong>4号車付近</strong></li></ul>
<p>改札内: 3、4、5、6番線ホーム（中央）～青山学院、青山通り方面改札<br>
改札外: 青山学院、青山通り方面改札～B3番出入口<br>
エレベーターのある出入口: B3番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ千代田線（表参道駅）・東京メトロ半蔵門線（表参道駅）・同一ホーム</p>
