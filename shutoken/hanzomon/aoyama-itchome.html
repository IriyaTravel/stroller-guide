<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>押上方面は<strong>7号車付近</strong>（確認中）</li><li>渋谷方面は<strong>7号車付近</strong>（確認中）</li></ul>
<p>改札内: ホーム（渋谷寄り）～北青山方面改札<br>
改札外: 北青山方面改札～地上（2番出入口）／北青山方面改札～地上（1番出入口）<br>
エレベーターのある出入口: 2番出入口・1番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ銀座線（青山一丁目駅）・都営大江戸線（青山一丁目駅）</p>
