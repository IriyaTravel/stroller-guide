<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>小島新田方面は未収集</li><li>京急川崎方面は未収集</li></ul>
<p>改札内: 改札階〜2番線（京急川崎方面）ホーム／改札階〜1番線（小島新田方面）ホーム<br>
改札外: 地上（駅舎出入口）〜改札階<br>
エレベーターのある出入口: エレベーター専用口のみ</p>
