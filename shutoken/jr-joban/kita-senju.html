<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>水戸方面は未収集</li><li>上野方面は未収集</li></ul>
<p>改札内: 北改札口・南改札口〜各ホーム<br>
改札外: 西口・仲町口〜改札階<br>
エレベーターのある出入口: 西口番出入口・仲町口番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ日比谷線（北千住駅）・東京メトロ千代田線（北千住駅）・伊勢崎線（東武スカイツリーライン）（北千住駅）・つくばエクスプレス（北千住駅）</p>
