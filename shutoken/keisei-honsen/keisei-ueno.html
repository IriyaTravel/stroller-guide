<p>改札内: 1・2番線ホーム〜改札口／3・4番線ホーム〜改札口<br>
改札外: 改札口〜正面口（地上）／改札口〜地下鉄連絡通路<br>
エレベーターのある出入口: 正面口番出入口</p>
<h2>この駅で乗り換える</h2>
