<p>エレベーターで降りるには</p>
<ul><li>京成上野方面は<strong>7号車付近</strong></li><li>成田空港方面は<strong>2号車付近</strong></li></ul>
<p>改札内: 1・2番線ホーム〜コンコース（改札階）／3・4番線ホーム〜コンコース（改札階）<br>
改札外: 北口地上〜コンコース（改札階）／南口地上〜コンコース（改札階）<br>
エレベーターのある出入口: 北口番出入口・南口番出入口</p>
