<p>エレベーターで降りるには</p>
<ul><li>京成上野方面は<strong>6号車付近</strong></li><li>成田空港方面は<strong>6号車付近</strong></li></ul>
<p>改札内: コンコース（2F）〜1番線ホーム（3F）／コンコース（2F）〜2番線ホーム（3F）<br>
改札外: 東口地上（1F）〜コンコース（2F）／西口地上（1F）〜コンコース（2F）<br>
エレベーターのある出入口: 東口番出入口・西口番出入口</p>
<h2>この駅で乗り換える</h2>
<p>徒歩乗り継ぎ: JR総武線（船橋駅）</p>
