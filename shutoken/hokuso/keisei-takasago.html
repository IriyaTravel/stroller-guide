<h1><span class="chip" style="background:#004B8D">HS</span>京成高砂（KS10・北総線）</h1>

<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>京成高砂方面は<strong>1号車付近</strong></li><li>印旛日本医大方面は<strong>2号車付近</strong></li></ul>
<p>改札内: 改札内コンコース（2F）〜1・2番線ホーム（1F）／改札内コンコース（2F）〜3・4番線ホーム（1F）<br>
改札外: 出入口〜改札外コンコース（2F）<br>
エレベーターのある出入口: エレベーター専用口のみ</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 成田スカイアクセス線（京成高砂駅）</p>
