<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>京成高砂方面は<strong>6号車付近</strong></li><li>印旛日本医大方面は<strong>8号車付近</strong></li></ul>
<p>改札内: 京成高砂・日本橋方面ホーム（3F）〜改札階（2F）／印旛日本医大・成田空港方面ホーム（3F）〜改札階（2F）<br>
改札外: 改札階（2F）〜地上出入口（1F）<br>
エレベーターのある出入口: エレベーター専用口のみ</p>
