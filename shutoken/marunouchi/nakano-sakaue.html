<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>池袋方面は<strong>2号車付近</strong></li><li>荻窪方面は<strong>2号車付近</strong></li><li>方南町方面は<strong>2号車付近</strong></li></ul>
<p>改札内: ホーム（荻窪寄り）～本町方面改札<br>
改札外: 本町方面改札～3番出入口<br>
エレベーターのある出入口: 3番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 都営大江戸線（中野坂上駅）</p>
