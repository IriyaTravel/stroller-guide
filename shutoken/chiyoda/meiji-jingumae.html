<h1><span class="chip" style="background:#009944">C</span>明治神宮前（C03・千代田線）</h1>

<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>綾瀬・取手方面は<strong>3・10号車付近</strong></li><li>代々木上原方面は<strong>3・10号車付近</strong></li></ul>
<p>改札内: ホーム（綾瀬寄り）～明治通り方面改札／ホーム（中央･代々木上原寄り）～代々木公園方面改札<br>
改札外: 明治通り方面改札～6番出入口／代々木公園方面改札～2番出入口<br>
エレベーターのある出入口: 6番出入口・2番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ副都心線（明治神宮前駅）<br>
徒歩乗り継ぎ: JR山手線（原宿駅）</p>
