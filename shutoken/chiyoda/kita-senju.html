<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>綾瀬・取手方面は<strong>7号車付近</strong></li><li>代々木上原方面は<strong>7号車付近</strong></li></ul>
<p>改札内: ホーム（中央）～西口駅前広場方面改札<br>
改札外: 駅ビル（ルミネ）方面改札～地上（ルミネ）／千住ミルディス方面改札～地上（丸井）／西口駅前広場方面改札～5番出口<br>
エレベーターのある出入口: 5番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ日比谷線（北千住駅）・JR常磐線（北千住駅）・東武スカイツリーライン（北千住駅）・つくばエクスプレス（北千住駅）</p>
