<h1><span class="chip" style="background:#80C241">JY</span>有楽町（JY30・山手線）</h1>
<p><a href="index.html#JY30">この駅から出発する（経路を組み立てる）</a></p>
<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>内回り（東京・上野方面）は<strong>7号車付近</strong></li><li>外回り（品川・渋谷方面）は<strong>6号車付近</strong></li></ul>
<p>改札内: 2・3番線ホーム（山手線）〜改札階／1・4番線ホーム（京浜東北線）〜改札階<br>
改札外: なし<br>
エレベーターのある出入口: なし</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: JR京浜東北線（有楽町駅）・東京メトロ有楽町線（有楽町駅）<br>
徒歩乗り継ぎ: 東京メトロ日比谷線（日比谷駅）・東京メトロ千代田線（日比谷駅）・都営三田線（日比谷駅）</p>
