<h1><span class="chip" style="background:#80C241">JY</span>原宿（JY19・山手線）</h1>
<p><a href="index.html#JY19">この駅から出発する（経路を組み立てる）</a></p>
<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>内回り（渋谷・品川方面）は<strong>6号車付近</strong></li><li>外回り（新宿・池袋方面）は<strong>10号車付近</strong></li></ul>
<p>改札内: 1・2番線ホーム〜改札階<br>
改札外: 改札階〜地上<br>
エレベーターのある出入口: 東口番出入口・西口番出入口</p>
<h2>この駅で乗り換える</h2>
<p>徒歩乗り継ぎ: 東京メトロ千代田線（明治神宮前駅）・東京メトロ副都心線（明治神宮前駅）</p>
