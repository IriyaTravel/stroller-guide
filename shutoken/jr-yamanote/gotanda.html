<h1><span class="chip" style="background:#80C241">JY</span>五反田（JY23・山手線）</h1>

<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>内回り（品川・東京方面）は<strong>8・11号車付近</strong></li><li>外回り（渋谷・新宿方面）は<strong>8・11号車付近</strong></li></ul>
<p>改札内: 1番線ホーム〜改札階／2番線ホーム〜改札階<br>
改札外: 地上〜改札階 レミィ五反田エレベーター<br>
エレベーターのある出入口: 東口番出入口・西口番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 都営浅草線（五反田駅）・池上線（五反田駅）</p>
