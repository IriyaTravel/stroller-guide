<h1><span class="chip" style="background:#80C241">JY</span>品川（JY25・山手線）</h1>
<p><a href="index.html#JY25">この駅から出発する（経路を組み立てる）</a></p>
<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>内回り（東京・上野方面）は<strong>5号車付近</strong></li><li>外回り（渋谷・新宿方面）は<strong>4号車付近</strong></li></ul>
<p>改札内: 1番線ホーム（山手線内回り）〜コンコース階／3・4番線ホーム（山手線外回り・京浜東北線）〜コンコース階<br>
改札外: なし<br>
エレベーターのある出入口: 高輪口番出入口・港南口番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 京急本線（品川駅）・JR京浜東北線（品川駅）・JR横須賀線（品川駅）・JR東海道線（品川駅）</p>
