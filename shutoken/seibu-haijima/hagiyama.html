<h1><span class="chip" style="background:#007BC1">SS</span>萩山（SS30・西武拝島線）</h1>
<p><a href="index.html#SS30">この駅から出発する（経路を組み立てる）</a></p>
<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>拝島方面は未収集</li><li>小平・西武新宿方面は未収集</li></ul>
<p>改札内: 改札階（橋上コンコース）〜1・2番線ホーム／改札階（橋上コンコース）〜3番線ホーム<br>
改札外: 南口・北口 地上〜改札階<br>
エレベーターのある出入口: エレベーター専用口のみ</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 西武多摩湖線（萩山駅）</p>
