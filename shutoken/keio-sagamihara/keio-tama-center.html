<h1><span class="chip" style="background:#C60076">KO</span>京王多摩センター（KO41・京王相模原線）</h1>
<p><a href="index.html#KO41">この駅から出発する（経路を組み立てる）</a></p>
<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>橋本方面は未収集</li><li>調布・新宿方面は未収集</li></ul>
<p>改札内: 改札階（2階）〜1・2番ホーム（3階）／改札階（2階）〜3・4番ホーム（3階）<br>
改札外: 地上〜2階改札階（駅東側・西側のエレベーター）<br>
エレベーターのある出入口: エレベーター専用口のみ</p>
<h2>この駅で乗り換える</h2>
<p>徒歩乗り継ぎ: 多摩線（小田急多摩センター駅）・多摩モノレール（多摩センター駅）</p>
