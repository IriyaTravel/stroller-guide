<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ベビーカー乗り換え案内</title>
<style>body{font-family:sans-serif;margin:1em;line-height:1.8;font-size:18px;max-width:640px}h1{font-size:1.25em}li a{padding:.35em 0;display:inline-block}input{font-size:18px;padding:.5em;width:100%;margin:.3em 0;box-sizing:border-box}button{font-size:18px;padding:.6em 1em;width:100%}</style>
</head><body>
<h1>ベビーカー乗り換え案内</h1>
<h2>駅名で探す</h2>
<p><input id="q" list="stations" placeholder="駅名を入力（例: 豊洲）">
<datalist id="stations"></datalist>
<button id="go">この駅を開く</button></p>
<h2>路線から探す</h2>
<ul><li><a href="tokyo/index.html">東京の路線一覧</a></li></ul>
<script>
const STATIONS = [{"name": "和光市", "code": "Y01", "yomi": "わこうし", "line": "有楽町線", "url": "tokyo/yurakucho/wakoshi.html"}, {"name": "地下鉄成増", "code": "Y02", "yomi": "ちかてつなります", "line": "有楽町線", "url": "tokyo/yurakucho/chikatetsu-narimasu.html"}, {"name": "地下鉄赤塚", "code": "Y03", "yomi": "ちかてつあかつか", "line": "有楽町線", "url": "tokyo/yurakucho/chikatetsu-akatsuka.html"}, {"name": "平和台", "code": "Y04", "yomi": "へいわだい", "line": "有楽町線", "url": "tokyo/yurakucho/heiwadai.html"}, {"name": "氷川台", "code": "Y05", "yomi": "ひかわだい", "line": "有楽町線", "url": "tokyo/yurakucho/hikawadai.html"}, {"name": "小竹向原", "code": "Y06", "yomi": "こたけむかいはら", "line": "有楽町線", "url": "tokyo/yurakucho/kotake-mukaihara.html"}, {"name": "千川", "code": "Y07", "yomi": "せんかわ", "line": "有楽町線", "url": "tokyo/yurakucho/senkawa.html"}, {"name": "要町", "code": "Y08", "yomi": "かなめちょう", "line": "有楽町線", "url": "tokyo/yurakucho/kanamecho.html"}, {"name": "池袋", "code": "Y09", "yomi": "いけぶくろ", "line": "有楽町線", "url": "tokyo/yurakucho/ikebukuro.html"}, {"name": "東池袋", "code": "Y10", "yomi": "ひがしいけぶくろ", "line": "有楽町線", "url": "tokyo/yurakucho/higashi-ikebukuro.html"}, {"name": "護国寺", "code": "Y11", "yomi": "ごこくじ", "line": "有楽町線", "url": "tokyo/yurakucho/gokokuji.html"}, {"name": "江戸川橋", "code": "Y12", "yomi": "えどがわばし", "line": "有楽町線", "url": "tokyo/yurakucho/edogawabashi.html"}, {"name": "飯田橋", "code": "Y13", "yomi": "いいだばし", "line": "有楽町線", "url": "tokyo/yurakucho/iidabashi.html"}, {"name": "市ケ谷", "code": "Y14", "yomi": "いちがや", "line": "有楽町線", "url": "tokyo/yurakucho/ichigaya.html"}, {"name": "麹町", "code": "Y15", "yomi": "こうじまち", "line": "有楽町線", "url": "tokyo/yurakucho/kojimachi.html"}, {"name": "永田町", "code": "Y16", "yomi": "ながたちょう", "line": "有楽町線", "url": "tokyo/yurakucho/nagatacho.html"}, {"name": "桜田門", "code": "Y17", "yomi": "さくらだもん", "line": "有楽町線", "url": "tokyo/yurakucho/sakuradamon.html"}, {"name": "有楽町", "code": "Y18", "yomi": "ゆうらくちょう", "line": "有楽町線", "url": "tokyo/yurakucho/yurakucho.html"}, {"name": "銀座一丁目", "code": "Y19", "yomi": "ぎんざいっちょうめ", "line": "有楽町線", "url": "tokyo/yurakucho/ginza-itchome.html"}, {"name": "新富町", "code": "Y20", "yomi": "しんとみちょう", "line": "有楽町線", "url": "tokyo/yurakucho/shintomicho.html"}, {"name": "月島", "code": "Y21", "yomi": "つきしま", "line": "有楽町線", "url": "tokyo/yurakucho/tsukishima.html"}, {"name": "豊洲", "code": "Y22", "yomi": "とよす", "line": "有楽町線", "url": "tokyo/yurakucho/toyosu.html"}, {"name": "辰巳", "code": "Y23", "yomi": "たつみ", "line": "有楽町線", "url": "tokyo/yurakucho/tatsumi.html"}, {"name": "新木場", "code": "Y24", "yomi": "しんきば", "line": "有楽町線", "url": "tokyo/yurakucho/shin-kiba.html"}];
const dl = document.getElementById('stations');
for (const s of STATIONS) dl.appendChild(new Option(s.name + '（' + s.yomi + '・' + s.line + '）', s.name));
function norm(t) {
  return t.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/[\s・]/g, '');
}
function openStation() {
  const raw = document.getElementById('q').value.trim();
  const q = norm(raw);
  const hit = STATIONS.find(s => s.name === raw || s.yomi === q)
    || STATIONS.find(s => s.name.includes(raw) || (q && s.yomi.includes(q)));
  if (hit) location.href = hit.url;
}
document.getElementById('go').onclick = openStation;
document.getElementById('q').addEventListener('change', openStation);
</script>
</body></html>
