function norm(s) { return s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60)).trim(); }
document.getElementById('go').onclick = () => {
  const q = document.getElementById('q').value.trim();
  const nq = norm(q);
  let hits = INDEX.filter(e => e.name === q || e.yomi === nq);
  if (!hits.length) hits = INDEX.filter(e => e.name.startsWith(q) || (nq && e.yomi.startsWith(nq)));
  const box = document.getElementById('choices');
  if (hits.length === 1) { location.href = hits[0].url; return; }
  if (!hits.length) { box.innerHTML = '<p>見つかりませんでした。</p>'; return; }
  box.innerHTML = '<p>駅を選んでください</p>' + hits.map(e =>
    '<a href="' + e.url + '"><span style="display:inline-block;background:' + e.color + ';color:#fff;border-radius:4px;padding:0 .45em;margin-right:.4em;font-weight:bold">' + e.letter + '</span>' + e.name + '（' + e.line + '）</a>').join('');
};
