let savedLast = null;
try { savedLast = JSON.parse(localStorage.getItem('stroller-last-route') || 'null'); } catch (e) {}
function renderContinue() {
  let html = '<h2>前回の続き</h2>';
  if (savedLast && savedLast.url && savedLast.label) {
    html += '<a href="' + savedLast.url + '">' + savedLast.label + '</a>';
  }
  html += '<button id="reset-last" type="button">前回の続きを消す</button>';
  document.getElementById('continue').innerHTML = html;
  document.getElementById('reset-last').onclick = () => {
    if (!savedLast) {
      const b = document.getElementById('reset-last');
      b.textContent = '保存された経路はありません';
      setTimeout(() => { b.textContent = '前回の続きを消す'; }, 2000);
      return;
    }
    if (!confirm('前回の続きを消しますか？')) return;
    try { localStorage.removeItem('stroller-last-route'); } catch (e) {}
    savedLast = null;
    renderContinue();
  };
}

function fgFor(hex) { const n = parseInt(String(hex || '').slice(1), 16); if (isNaN(n)) return '#fff'; const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 158 ? '#1c1a16' : '#fff'; }
function norm(s) { return s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60)).trim(); }
document.getElementById('q').addEventListener('input', () => {
  const q = document.getElementById('q').value.trim();
  const nq = norm(q);
  const box = document.getElementById('choices');
  if (!q) { box.innerHTML = ''; return; }
  const hits = INDEX.filter(e => e.name.includes(q) || (nq && e.yomi.includes(nq)));
  hits.sort((a, b) => {
    const pa = (a.name.startsWith(q) || (nq && a.yomi.startsWith(nq))) ? 0 : 1;
    const pb = (b.name.startsWith(q) || (nq && b.yomi.startsWith(nq))) ? 0 : 1;
    return pa - pb;
  });
  box.innerHTML = hits.length
    ? hits.slice(0, 30).map(e =>
      '<a href="' + e.url + '"><span style="display:inline-block;min-width:2.3em;height:1.6em;line-height:1.6em;text-align:center;box-sizing:border-box;vertical-align:-.32em;border-radius:3px;padding:0 .3em;margin-right:.4em;font-weight:800;' + (e.letter ? 'background:' + e.color + ';color:' + fgFor(e.color) : 'background:transparent;border:2px solid ' + e.color) + '">' + (e.letter || '&nbsp;') + '</span>' + e.name + '（' + e.line + '）</a>').join('')
    : '<p>見つかりませんでした。</p>';
});

function resolveAll(parsed) {
  const rawRides = segmentRides(parsed.stops, parsed.legs);
  const rides = [], unresolved = [];
  let prevLid = null;
  rawRides.forEach(r => {
    const res = r.stops.length > 2 ? resolveMulti(r, prevLid) : (resolveSingle(r, prevLid) || resolveMulti(r, prevLid));
    if (res) { rides.push({ raw: r, res: res }); const cl = res.candidates[0].legs; prevLid = cl[cl.length - 1].lid; }
    else unresolved.push(r);
  });
  return { rides: rides, unresolved: unresolved };
}
function ridePick(rr) { return rr.res.candidates[rr.res.pick]; }
function connectorKind(rr1, rr2) {
  const a = ridePick(rr1).endSid, b = ridePick(rr2).startSid;
  if (a === b) return 'same';
  if (isWalkPair(a, b)) return 'walk';
  return 'broken';
}
function buildYahooUrl() {
  const legs = [];
  YSTATE.rides.forEach(rr => ridePick(rr).legs.forEach(l => legs.push(l)));
  const last = legs[legs.length - 1];
  const hist = legs.slice(0, -1).map(l => l.lid + ':' + l.from + '-' + l.to + (l.thru ? '~' : '')).join('>');
  return ILINES[last.lid].region + '/' + last.lid + '/index.html#' + (hist ? hist + '>' : '') + last.from + '-' + last.to + '-exit';
}
function renderYahoo() {
  const box = document.getElementById('yres');
  const rides = YSTATE.rides;
  let html = '', broken = false;
  rides.forEach((rr, i) => {
    if (i > 0) {
      const kind = connectorKind(rides[i - 1], rr);
      if (kind === 'walk') html += '<p>↓ ' + rides[i - 1].raw.stops[rides[i - 1].raw.stops.length - 1].name + '駅 → ' + rr.raw.stops[0].name + '駅（徒歩）</p>';
      else if (kind === 'broken') { html += '<p>↓ 乗り換えがつながりません</p>'; broken = true; }
      else html += '<p>↓ 乗り換え</p>';
    }
    const c = ridePick(rr);
    const from = rr.raw.stops[0].name, to = rr.raw.stops[rr.raw.stops.length - 1].name;
    const label = c.legs.length === 1 ? ILINES[c.legs[0].lid].label
      : c.legs.map(l => ILINES[l.lid].label).join('・') + '（直通）';
    html += '<p>' + (i + 1) + '. <strong>' + from + '駅 → ' + to + '駅</strong>（' +
      (rr.res.candidates.length > 1
        ? '<button type="button" class="yline" data-r="' + i + '">' + label + ' ▼</button>'
        : label) + '）</p>';
  });
  if (YSTATE.unresolved.length) {
    html += '<h3>取り込めなかった区間</h3>' + YSTATE.unresolved.map(r =>
      '<p>・ ' + r.stops[0].name + ' → ' + r.stops[r.stops.length - 1].name + (r.hints[0] ? '（' + r.hints[0] + '）' : '') + '</p>').join('');
  }
  if (rides.length && !broken) html += '<button id="yopen" type="button">この経路で案内を見る</button>';
  else if (rides.length) html += '<p>つながらない乗り換えがあるため開けません。</p>';
  box.innerHTML = html;
  box.querySelectorAll('.yline').forEach(btn => {
    btn.onclick = () => {
      const rr = YSTATE.rides[Number(btn.getAttribute('data-r'))];
      rr.res.pick = (rr.res.pick + 1) % rr.res.candidates.length;
      renderYahoo();
    };
  });
  const yo = document.getElementById('yopen');
  if (yo) yo.onclick = () => { location.href = buildYahooUrl(); };
}
document.getElementById('ygo').onclick = () => {
  const parsed = parseYahoo(document.getElementById('yq').value);
  const box = document.getElementById('yres');
  if (parsed.stops.length < 2) {
    YSTATE = null;
    box.innerHTML = '<p>読み取れませんでした。</p>';
    return;
  }
  YSTATE = resolveAll(parsed);
  if (!YSTATE.rides.length) {
    box.innerHTML = '<p>取り込める区間がありませんでした。</p>' +
      (YSTATE.unresolved.length ? '<h3>取り込めなかった区間</h3>' + YSTATE.unresolved.map(r =>
        '<p>・ ' + r.stops[0].name + ' → ' + r.stops[r.stops.length - 1].name + (r.hints[0] ? '（' + r.hints[0] + '）' : '') + '</p>').join('') : '');
    return;
  }
  renderYahoo();
};
