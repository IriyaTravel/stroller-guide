<h1><span class="chip" style="background:#009AD6">T</span>西船橋（T23・東西線）</h1>

<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>中野方面は<strong>4号車付近</strong>（確認中）</li></ul>
<p>改札内: 5、6・7、8番線ホーム（中央）～改札<br>
改札外: 改札～北口出入口／改札～南口出入口<br>
エレベーターのある出入口: エレベーター専用口のみ</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: JR中央・総武線各駅停車（西船橋駅）・JR武蔵野線（西船橋駅）・JR京葉線（西船橋駅）・東葉高速線（西船橋駅）</p>
