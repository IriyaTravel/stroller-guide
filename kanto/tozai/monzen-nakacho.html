<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>西船橋方面は<strong>1号車付近</strong>（確認中）</li><li>中野方面は<strong>1号車付近</strong>（確認中）</li></ul>
<p>改札内: 2番線ホーム（西船橋寄り）～富岡八幡宮方面改札／1番線ホーム（西船橋寄り）～富岡八幡宮方面改札<br>
改札外: 富岡八幡宮方面改札～2番出入口／門前仲町交差点方面改札～4番出入口<br>
エレベーターのある出入口: 2番出入口・4番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 都営大江戸線（門前仲町駅）</p>
