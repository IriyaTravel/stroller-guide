<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>押上方面は<strong>3号車付近</strong></li><li>青砥方面は<strong>4号車付近</strong></li></ul>
<p>改札内: 改札口（中2階）〜2階ホーム（1・2番線）・3階ホーム（3・4番線）<br>
改札外: 改札口（中2階）〜1階出入口<br>
エレベーターのある出入口: エレベーター専用口のみ</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 本線（青砥駅）</p>
