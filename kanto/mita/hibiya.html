<h1><span class="chip" style="background:#00418E">I</span>日比谷（I08・都営三田線）</h1>
<p><a href="index.html#I08">この駅から出発する（経路を組み立てる）</a></p>
<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>目黒方面は<strong>5号車付近</strong></li><li>西高島平方面は<strong>5号車付近</strong></li></ul>
<p>改札内: 改札口〜ホーム<br>
改札外: 改札階〜B3出入口（帝国劇場）／改札階〜B5出入口（丸の内二重橋ビル）<br>
エレベーターのある出入口: B3番出入口・B5番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ日比谷線（日比谷駅）・東京メトロ千代田線（日比谷駅）<br>
徒歩乗り継ぎ: 東京メトロ有楽町線（有楽町駅）・JR山手線（有楽町駅）・JR京浜東北線（有楽町駅）</p>
