<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>池袋方面は<strong>4号車付近</strong></li><li>荻窪方面は<strong>4号車付近</strong></li></ul>
<p>改札内: ホーム（中央）～改札<br>
改札外: 改札～M10出入口（オアゾ内）／改札～エレベーター専用口（丸ビル方面）<br>
エレベーターのある出入口: M10番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: JR山手線（東京駅）・JR京浜東北線（東京駅）・JR中央線（東京駅）・他</p>
