<h1><span class="chip" style="background:#E60012">M</span>大手町（M18・丸ノ内線）</h1>
<p><a href="index.html#M18">この駅から出発する（経路を組み立てる）</a></p>
<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>池袋方面は<strong>2号車付近</strong></li><li>荻窪方面は<strong>1号車付近</strong></li></ul>
<p>改札内: なし<br>
改札外: 丸の内方面改札～A5番出入口（野村ビル）<br>
エレベーターのある出入口: A5番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ東西線（大手町駅）・東京メトロ千代田線（大手町駅）・東京メトロ半蔵門線（大手町駅）・都営三田線（大手町駅）</p>
