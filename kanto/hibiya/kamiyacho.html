<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>北千住方面は<strong>2号車付近</strong></li><li>中目黒方面は<strong>7号車付近</strong></li></ul>
<p>改札内: 1番線ホーム（北千住寄り）～虎ノ門方面改札／1番線ホーム（中目黒寄り）～飯倉方面改札／2番線ホーム（北千住寄り）～虎ノ門方面改札／2番線ホーム（中目黒寄り）～飯倉方面改札<br>
改札外: 虎ノ門方面改札～メトロシティ神谷町／虎ノ門方面改札～4a番出入口／飯倉方面改札～1番出入口<br>
エレベーターのある出入口: 4a番出入口・1番出入口</p>
