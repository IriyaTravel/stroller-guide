<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>北千住方面は<strong>4号車付近</strong></li><li>中目黒方面は<strong>4号車付近</strong></li></ul>
<p>改札内: ホーム（中央）～中央改札<br>
改札外: 中央改札～B2番出入口／中央改札～B8番出入口<br>
エレベーターのある出入口: B2番出入口・B8番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ丸ノ内線（銀座駅）・東京メトロ銀座線（銀座駅）<br>
徒歩乗り継ぎ: 東京メトロ有楽町線（銀座一丁目駅）</p>
