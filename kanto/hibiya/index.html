  return ' <a class="dlink" href="' + ns.station_id + '.html">駅の詳細</a>';
}
function histStr(st) { return st.hist.map(h => h.lid + ':' + h.from + '-' + h.to).join('>'); }
function curHash(st, suffix) { const hs = histStr(st); return '#' + (hs ? hs + '>' : '') + suffix; }
function backHref(st) {
  if (st.branch) return curHash(st, st.from + '-' + st.to);
  if (st.to) return curHash(st, st.from);
  if (st.hist.length) {
    const last = st.hist[st.hist.length - 1];
    const pre = st.hist.slice(0, -1).map(h => h.lid + ':' + h.from + '-' + h.to).join('>');
    return '../' + last.lid + '/index.html#' + (pre ? pre + '>' : '') + last.from + '-' + last.to + '-xfer';
  }
  return '#';
}
function restartHref(st) { return st.hist.length ? '../' + st.hist[0].lid + '/index.html' : '#'; }
function navRow(st) {
  return '<div class="navrow"><a href="' + backHref(st) + '">前に戻る</a>'
    + '<a href="' + restartHref(st) + '" onclick="return askReset()">最初からやり直す</a></div>';
}
function detailLinkIn(lid, code) {
  const s = stationsOf(lid).find(x => x.code === code);
  const href = (lid === DATA.lid ? '' : '../' + lid + '/') + s.station_id + '.html';
  return ' <a class="dlink" href="' + href + '">駅の詳細</a>';
}
function exitHtml(st, d) {
  const legs = st.hist.concat([{ lid: DATA.lid, from: st.from, to: st.to }]);
  let sum = '<h2>経路</h2>';
  legs.forEach((leg, i) => {
    if (i > 0) {
      const prev = legs[i - 1];
      sum += (nameIn(leg.lid, leg.from) === nameIn(prev.lid, prev.to))
        ? '<p>↓ ' + nameIn(leg.lid, leg.from) + '駅で乗り換え</p>'
        : '<p>↓ ' + nameIn(leg.lid, leg.from) + '駅へ徒歩乗り継ぎ</p>';
    }
    sum += '<p><strong>' + DATA.all[leg.lid].display + ' ' + nameIn(leg.lid, leg.from) + ' → ' + nameIn(leg.lid, leg.to) + '</strong><br>'
      + '乗る: ' + boardingIn(leg.lid, leg.from, leg.to) + detailLinkIn(leg.lid, leg.from) + '<br>'
      + '降りる: ' + boardingIn(leg.lid, leg.to, leg.from) + detailLinkIn(leg.lid, leg.to)
      + (DATA.fleetByLine[leg.lid] ? '<br>フリースペース: ' + DATA.fleetByLine[leg.lid] : '') + '</p>';
  });
  const exits = d.exits.length ? d.exits.map(e => e + '番出入口').join('・') : 'エレベーター専用口のみ';
  return sum
    + '<h2>' + nameOf(st.to) + '駅で出る</h2><p>改札内: ' + (d.ev_in.join('／') || 'なし') + '<br>'
    + '改札外: ' + (d.ev_out.join('／') || 'なし') + '<br>'
    + 'エレベーターのある出入口: ' + exits + '</p>'
    + navRow(st);
}
function saveLast(st) {
  if (!st.from || !st.to) return;
  try {
    const legs = st.hist.concat([{ lid: DATA.lid, from: st.from, to: st.to }]);
    const label = legs.map(l => DATA.all[l.lid].display + ' ' + nameIn(l.lid, l.from) + ' → ' + nameIn(l.lid, l.to)).join(' ／ ');
    localStorage.setItem('stroller-last-route', JSON.stringify({ url: location.pathname + location.hash, label: label }));
  } catch (e) {}
}
function render() {
  const st = parseHash();
  saveLast(st);
  let html = '';
  if (st.from) {
    html += '<p class="chips"><a href="#" onclick="return askReset()">乗る駅: ' + nameOf(st.from) + '</a>';
    if (st.to) html += '<a href="' + curHash(st, st.from) + '">降りる駅: ' + nameOf(st.to) + '</a>';
    html += '</p>';
  }
  if (!st.from) {
    html += '<h2>乗る駅をタップしてください</h2><div class="step">' + stationButtons([], c => '#' + c) + '</div>';
  } else if (!st.to) {
    html += '<h2>降りる駅をタップしてください</h2><div class="step">' + stationButtons([st.from], c => curHash(st, st.from + '-' + c)) + '</div>' + navRow(st);
  } else {
    const d = detailsOf(st.to);
    const hasXfer = (d.t_same || d.t_walk || d.xfer_same.length || d.xfer_walk.length);
    if (!st.branch && hasXfer) {
      html += '<h2>' + nameOf(st.to) + '駅では</h2><div class="step">'
        + '<a href="' + curHash(st, st.from + '-' + st.to + '-exit') + '">出る</a>'
        + '<a href="' + curHash(st, st.from + '-' + st.to + '-xfer') + '">乗り換える</a>'
        + '</div>' + navRow(st);
    } else if (!st.branch || st.branch === 'exit') {
      html += exitHtml(st, d);
    } else {
      html += '<h2>' + nameOf(st.to) + '駅で乗り換える</h2>';
      const renderGroup = (title, texts, links) => {
        let out = '';
        if (texts.length || links.length) {
          out += '<p>' + title + '</p><div class="step">';
          out += links.map(l => '<a href="../' + l.lid + '/index.html#' + histPrefix(st) + l.code + '">' + l.label + ' に乗り換える</a>').join('');
          out += '</div>';
          if (texts.length) out += '<p>' + texts.join('<br>') + '</p>';
        }
        return out;
      };
      html += renderGroup('乗り換え', d.t_same_texts, d.xfer_same);
      html += renderGroup('徒歩乗り継ぎ', d.t_walk_texts, d.xfer_walk);
      html += navRow(st);
    }
  }
  flow.innerHTML = html;
}
window.addEventListener('hashchange', render);
render();

</script>
</body></html>
