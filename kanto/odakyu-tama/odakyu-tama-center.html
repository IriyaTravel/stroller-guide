<h1><span class="chip" style="background:#005BAC">OT</span>小田急多摩センター（OT06・多摩線）</h1>
<p><a href="index.html#OT06">この駅から出発する（経路を組み立てる）</a></p>
<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>新百合ヶ丘方面は<strong>7号車付近</strong></li><li>唐木田方面は<strong>7号車付近</strong></li></ul>
<p>改札内: 改札階（コンコース）〜1番線ホーム／改札階（コンコース）〜2番線ホーム<br>
改札外: 改札階（コンコース）〜地上（西側）／改札階（コンコース）〜地上（南側）<br>
エレベーターのある出入口: エレベーター専用口のみ</p>
<h2>この駅で乗り換える</h2>
<p>徒歩乗り継ぎ: 相模原線（京王多摩センター駅）・多摩モノレール（多摩センター駅）</p>
