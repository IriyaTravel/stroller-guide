  const allW = known.filter(v => v.space === 'all').reduce((a, v) => a + v.w, 0);
  if (allW === total) return '全号車にスペースあり';
  const tier = r => r >= 0.85 ? 'ほぼ全て' : (r >= 0.5 ? '半分以上' : '一部');
  const carSet = new Set();
  known.forEach(v => (v.cars || []).forEach(c => carSet.add(c)));
  const rated = [...carSet].map(c => {
    const w = known.filter(v => v.space === 'all' || (v.cars || []).includes(c)).reduce((a, v) => a + v.w, 0);
    return { c: c, r: w / total };
  }).filter(x => x.r > 0).sort((a, b) => b.r - a.r || a.c - b.c);
  if (!rated.length) return 'スペースなし';
  const byTier = {};
  rated.forEach(x => { (byTier[tier(x.r)] = byTier[tier(x.r)] || []).push(x.c); });
  let parts = ['ほぼ全て', '半分以上', '一部'].filter(t => byTier[t])
    .map(t => byTier[t].sort((a, b) => a - b).join('・') + '号車付近（' + t + '）');
  const allR = allW / total;
  if (allR >= 0.3) parts.push('全号車にスペースのある車両も' + (allR >= 0.5 ? '半分以上' : '一部'));
  return parts.join('／');
}
function xferCar(lid, code, target, wantLine) {
  const s = stationsOf(lid).find(x => x.code === code);
  if (!s || !DATA.xfer) return null;
  const tx = (DATA.xfer[s.station_id] || {})[lid];
  if (!tx) return null;
  const adj = adjOf(lid);
  let step = null;
  for (const n of adj[code]) {
    if (n === target || reachableIn(lid, n, code).has(target)) { step = n; break; }
  }
  let dir = null;
  if (step) {
    const reach = reachableIn(lid, step, code);
    const sts = stationsOf(lid);
    for (const pl of s.platforms) {
      const term = sts.find(x => x.station_id === pl.direction.replace('toward_', ''));
      if (term && (term.code === step || reach.has(term.code))) { dir = pl.direction; break; }
    }
  }
  if (!dir && s.platforms.length === 1) dir = s.platforms[0].direction;
  const tpl = tx.platforms.find(x => x.direction === dir);
  if (!tpl || tpl.elevators.length < 2) return null;
  const ev = tpl.elevators.find(e => (e.best_for || []).includes(wantLine));
  return ev ? ev.car : null;
}
function histPrefix(st) {
  const legs = st.hist.concat([{ lid: DATA.lid, from: st.from, to: st.to }]);
  return legs.map(l => l.lid + ':' + l.from + '-' + l.to).join('>') + '>';
}
function parseHash() {
  let raw = location.hash.replace(/^#/, '');
  try { raw = decodeURIComponent(raw); } catch (e) {}
  const segs = raw.split('>');
  const cur = segs[segs.length - 1];
  const hist = segs.slice(0, -1).map(sg => {
    const m = sg.split(':'); const ft = (m[1] || '').split('-');
    return { lid: m[0], from: ft[0], to: ft[1] };
  }).filter(h => DATA.all[h.lid] && h.from && h.to);
  const parts = cur.split('-').filter(x => x !== '');
  const st = { from: null, to: null, branch: null, hist: hist };
  if (parts[0] && CODES.includes(parts[0])) st.from = parts[0];
  if (st.from && parts[1] && CODES.includes(parts[1])) st.to = parts[1];
  if (st.from && st.to && (parts[2] === 'exit' || parts[2] === 'xfer')) st.branch = parts[2];
  return st;
}
function stationButtons(exclude, makeHref) {
  return DATA.network.stations.filter(ns => !exclude.includes(ns.code))
    .map(ns => '<a href="' + makeHref(ns.code) + '">' + ns.code + ' ' + ns.name + '</a>').join('');
}
function askReset() { return confirm('最初から選び直しますか？'); }
function detailLink(code) {
  const ns = NS[code];
  return ' <a class="dlink" href="' + ns.station_id + '.html">駅の詳細</a>';
}
function histStr(st) { return st.hist.map(h => h.lid + ':' + h.from + '-' + h.to).join('>'); }
function curHash(st, suffix) { const hs = histStr(st); return '#' + (hs ? hs + '>' : '') + suffix; }
function backHref(st) {
  if (st.branch) return curHash(st, st.from + '-' + st.to);
  if (st.to) return curHash(st, st.from);
  if (st.hist.length) {
    const last = st.hist[st.hist.length - 1];
    const pre = st.hist.slice(0, -1).map(h => h.lid + ':' + h.from + '-' + h.to).join('>');
    return '../' + last.lid + '/index.html#' + (pre ? pre + '>' : '') + last.from + '-' + last.to + '-xfer';
  }
  return '#';
}
function restartHref(st) { return st.hist.length ? '../' + st.hist[0].lid + '/index.html' : '#'; }
function navRow(st) {
  return '<div class="navrow"><a href="' + backHref(st) + '">前に戻る</a>'
    + '<a href="' + restartHref(st) + '" onclick="return askReset()">最初からやり直す</a></div>';
}
function detailLinkIn(lid, code) {
  const s = stationsOf(lid).find(x => x.code === code);
  const href = (lid === DATA.lid ? '' : '../' + lid + '/') + s.station_id + '.html';
  return ' <a class="dlink" href="' + href + '">駅の詳細</a>';
}
function exitHtml(st, d) {
  const legs = st.hist.concat([{ lid: DATA.lid, from: st.from, to: st.to }]);
  let sum = '<h2>経路</h2>';
  legs.forEach((leg, i) => {
    if (i > 0) {
      const prev = legs[i - 1];
      sum += (nameIn(leg.lid, leg.from) === nameIn(prev.lid, prev.to))
        ? '<p>↓ ' + nameIn(leg.lid, leg.from) + '駅で乗り換え</p>'
        : '<p>↓ ' + nameIn(leg.lid, leg.from) + '駅へ徒歩乗り継ぎ</p>';
    }
    let boardNote = '', alightNote = '';
    if (i > 0) {
      const prev = legs[i - 1];
      if (nameIn(leg.lid, leg.from) === nameIn(prev.lid, prev.to)) {
        const xc = xferCar(leg.lid, leg.from, leg.to, prev.lid);
        if (xc != null) boardNote = '<br>（' + DATA.all[prev.lid].display + 'からの乗り換えは' + xc + '号車付近のエレベーター）';
      }
    }
    if (i < legs.length - 1) {
      const next = legs[i + 1];
      if (nameIn(next.lid, next.from) === nameIn(leg.lid, leg.to)) {
        const xc = xferCar(leg.lid, leg.to, leg.from, next.lid);
        if (xc != null) alightNote = '<br>（' + DATA.all[next.lid].display + 'への乗り換えは' + xc + '号車付近のエレベーター）';
      }
    }
    sum += '<p><strong>' + DATA.all[leg.lid].display + ' ' + nameIn(leg.lid, leg.from) + ' → ' + nameIn(leg.lid, leg.to) + '</strong><br>'
      + '乗る: ' + boardingIn(leg.lid, leg.from, leg.to) + detailLinkIn(leg.lid, leg.from) + boardNote + '<br>'
      + '降りる: ' + alightingIn(leg.lid, leg.to, leg.from) + detailLinkIn(leg.lid, leg.to) + alightNote
      + '<br>フリースペース: ' + spaceText(leg.lid, leg.from, leg.to) + '</p>';
  });
  const exits = d.exits.length ? d.exits.map(e => e + '番出入口').join('・') : (d.ev_out.length ? 'エレベーター専用口のみ' : 'なし');
  return sum
    + '<h2>' + nameOf(st.to) + '駅で出る</h2><p>改札内: ' + (d.ev_in.join('／') || 'なし') + '<br>'
    + '改札外: ' + (d.ev_out.join('／') || 'なし') + '<br>'
    + 'エレベーターのある出入口: ' + exits + '</p>'
    + navRow(st);
}
function saveLast(st) {
  if (!st.from || !st.to) return;
  try {
    const legs = st.hist.concat([{ lid: DATA.lid, from: st.from, to: st.to }]);
    const label = legs.map(l => DATA.all[l.lid].display + ' ' + nameIn(l.lid, l.from) + ' → ' + nameIn(l.lid, l.to)).join(' ／ ');
    localStorage.setItem('stroller-last-route', JSON.stringify({ url: location.pathname + location.hash, label: label }));
  } catch (e) {}
}
function render() {
  const st = parseHash();
  saveLast(st);
  let html = '';
  if (st.from) {
    html += '<p class="chips"><a href="#" onclick="return askReset()">乗る駅: ' + nameOf(st.from) + '</a>';
    if (st.to) html += '<a href="' + curHash(st, st.from) + '">降りる駅: ' + nameOf(st.to) + '</a>';
    html += '</p>';
  }
  if (!st.from) {
    html += '<h2>乗る駅をタップしてください</h2><div class="step">' + stationButtons([], c => '#' + c) + '</div>';
  } else if (!st.to) {
    html += '<h2>降りる駅をタップしてください</h2><div class="step">' + stationButtons([st.from], c => curHash(st, st.from + '-' + c)) + '</div>' + navRow(st);
  } else {
    const d = detailsOf(st.to);
    const hasXfer = (d.t_same || d.t_walk || d.xfer_same.length || d.xfer_walk.length);
    if (!st.branch && hasXfer) {
      html += '<h2>' + nameOf(st.to) + '駅では</h2><div class="step">'
        + '<a href="' + curHash(st, st.from + '-' + st.to + '-exit') + '">出る</a>'
        + '<a href="' + curHash(st, st.from + '-' + st.to + '-xfer') + '">乗り換える</a>'
        + '</div>' + navRow(st);
    } else if (!st.branch || st.branch === 'exit') {
      html += exitHtml(st, d);
    } else {
      html += '<h2>' + nameOf(st.to) + '駅で乗り換える</h2>';
      const renderGroup = (title, texts, links) => {
        let out = '';
        if (texts.length || links.length) {
          out += '<p>' + title + '</p><div class="step">';
          out += links.map(l => '<a href="../' + l.lid + '/index.html#' + histPrefix(st) + l.code + '">' + l.label + ' に乗り換える</a>').join('');
          out += '</div>';
          if (texts.length) out += '<p>' + texts.join('<br>') + '</p>';
        }
        return out;
      };
      html += renderGroup('乗り換え', d.t_same_texts, d.xfer_same);
      html += renderGroup('徒歩乗り継ぎ', d.t_walk_texts, d.xfer_walk);
      html += navRow(st);
    }
  }
  flow.innerHTML = html;
}
window.addEventListener('hashchange', render);
render();

</script>
