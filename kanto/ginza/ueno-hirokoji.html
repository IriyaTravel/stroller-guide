<h1><span class="chip" style="background:#FF9500">G</span>上野広小路（G15・銀座線）</h1>
<p><a href="index.html#G15">この駅から出発する（経路を組み立てる）</a></p>
<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>渋谷方面は<strong>2号車付近</strong>（確認中）</li><li>浅草方面は<strong>1号車付近</strong>（確認中）</li></ul>
<p>改札内: なし<br>
改札外: 改札（1番線ホーム）～A1番出入口／改札（2番線ホーム）～エレベーター専用口<br>
エレベーターのある出入口: A1番出入口</p>
<h2>この駅で乗り換える</h2>
<p>徒歩乗り継ぎ: 東京メトロ日比谷線（仲御徒町駅）・都営大江戸線（上野御徒町駅）・JR山手線（御徒町駅）・JR京浜東北線（御徒町駅）</p>
