<h1><span class="chip" style="background:#FF9500">G</span>銀座（G09・銀座線）</h1>
<p><a href="index.html#G09">この駅から出発する（経路を組み立てる）</a></p>
<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>渋谷方面は<strong>5号車付近</strong></li><li>浅草方面は<strong>5号車付近</strong></li></ul>
<p>改札内: ホーム（浅草寄り）～銀座四丁目交差点改札<br>
改札外: 銀座四丁目交差点改札～A7番出入口／銀座四丁目交差点改札～B2番出入口<br>
エレベーターのある出入口: A7番出入口・B2番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ丸ノ内線（銀座駅）・東京メトロ日比谷線（銀座駅）<br>
徒歩乗り継ぎ: 東京メトロ有楽町線（銀座一丁目駅）</p>
