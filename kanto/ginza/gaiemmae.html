<p>改札内: ホーム（浅草寄り）～外苑いちょう並木方面改札／ホーム（渋谷寄り）～神宮球場方面改札<br>
改札外: 外苑いちょう並木方面改札～4番出入口／神宮球場方面改札～2a番出入口<br>
エレベーターのある出入口: 2a番出入口・4番出入口</p>
