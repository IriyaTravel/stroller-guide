<h1>東池袋（Y10・有楽町線）</h1>
<p><a href="index.html#higashi-ikebukuro-none-">この駅から出発する（経路を組み立てる）</a></p>
<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>新木場方面は<strong>8号車付近</strong></li><li>和光市方面は<strong>8号車付近</strong></li></ul>
<p>改札内: ホーム（新木場寄り）〜雑司が谷方面改札<br>
改札外: 雑司ヶ谷方面改札〜4番出入口／西改札〜1番出入口／西改札〜6番出入口（6:00〜終車時）<br>
エレベーターのある出入口: 1番出入口・4番出入口・6番出入口</p>
<h2>この駅で乗り換える</h2>
<p>徒歩乗り継ぎ: 都電荒川線（東京さくらトラム）（東池袋四丁目駅）</p>
