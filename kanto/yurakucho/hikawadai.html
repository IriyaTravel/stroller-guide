<h1>氷川台（Y05・有楽町線）</h1>

<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>新木場・渋谷方面は<strong>5号車付近</strong></li><li>和光市方面は<strong>7号車付近</strong></li></ul>
<p>改札内: 1番線ホーム（中央）～改札／2番線ホーム（中央）～改札<br>
改札外: 改札～エレベーター専用口<br>
エレベーターのある出入口: エレベーター専用口番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ副都心線（氷川台駅）</p>
