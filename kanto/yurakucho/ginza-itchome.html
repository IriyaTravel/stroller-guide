<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>新木場方面は<strong>8号車付近</strong></li><li>和光市方面は<strong>8号車付近</strong></li></ul>
<p>改札内: ホーム（新木場寄り）～銀座通り方面改札<br>
改札外: 銀座通り方面改札～連絡階～地上<br>
エレベーターのある出入口: 6番出入口</p>
<h2>この駅で乗り換える</h2>
<p>徒歩乗り継ぎ: 東京メトロ銀座線（銀座駅）・東京メトロ丸ノ内線（銀座駅）・東京メトロ日比谷線（銀座駅）</p>
