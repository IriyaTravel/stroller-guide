<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>新木場方面は<strong>5号車付近</strong>（確認中）</li><li>和光市方面は<strong>4号車付近</strong></li></ul>
<p>改札内: ホーム（中央）〜要町方面改札<br>
改札外: 要町方面改札〜エレベーター専用口<br>
エレベーターのある出入口: エレベーター専用口のみ</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ副都心線（要町駅）</p>
