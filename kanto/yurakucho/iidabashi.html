<h2>エレベーターで降りるには</h2>
<ul><li>新木場方面は<strong>2号車付近</strong></li><li>和光市方面は<strong>1号車付近</strong></li></ul>
<h2>エレベーター</h2>
<p>改札内: ホーム（和光市寄り）～飯田橋方面改札<br>
改札外: 中央改札～エレベーター専用口／東西線～有楽町線・南北線・大江戸線乗換連絡通路<br>
エレベーターのある出入口: エレベーター専用口のみ</p>
<h2>その他</h2>
<p>乗り換え: 東京メトロ東西線（飯田橋駅）・東京メトロ南北線（飯田橋駅）・都営大江戸線（飯田橋駅）・JR中央・総武線各駅停車（飯田橋駅）</p>
