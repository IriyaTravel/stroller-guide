<p><a href="index.html#ikebukuro-none-">この駅から出発する（経路を組み立てる）</a></p>
<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>新木場方面は<strong>3号車付近</strong></li><li>和光市方面は<strong>3号車付近</strong></li></ul>
<p>改札内: ホーム（和光市寄り）〜南通路西改札<br>
改札外: 南通路西改札〜4番出入口（エソラ）<br>
エレベーターのある出入口: 4番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ丸ノ内線（池袋駅）・東京メトロ副都心線（池袋駅）・JR山手線（池袋駅）・JR埼京線（池袋駅）・JR湘南新宿ライン（池袋駅）・東武東上線（池袋駅）・西武池袋線（池袋駅）</p>
