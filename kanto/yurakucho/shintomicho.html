<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>新木場方面は<strong>5号車付近</strong></li><li>和光市方面は<strong>5号車付近</strong></li></ul>
<p>改札内: ホーム（中央）～明石町方面・中央区役所方面改札<br>
改札外: 中央区役所方面改札～エレベーター専用口<br>
エレベーターのある出入口: 1番出入口</p>
<h2>この駅で乗り換える</h2>
<p>徒歩乗り継ぎ: 東京メトロ日比谷線（築地駅）</p>
