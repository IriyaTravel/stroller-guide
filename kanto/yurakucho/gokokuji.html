<h2>エレベーター</h2>
<p>改札内: ホーム（中央付近）〜音羽方面改札／ホーム（和光市方）〜護国寺方面改札<br>
改札外: 音羽方面改札〜6番出入口／護国寺方面改札〜1番出入口<br>
エレベーターのある出入口: 1番出入口・6番出入口</p>
