<h1><span class="chip" style="background:#C1A470">Y</span>永田町（Y16・有楽町線）</h1>
<p><a href="index.html#Y16">この駅から出発する（経路を組み立てる）</a></p>
<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>新木場方面は<strong>2号車付近</strong></li><li>和光市方面は<strong>2号車付近</strong></li></ul>
<p>改札内: ホーム（和光市寄り）～半蔵門線・南北線連絡階～平河町方面改札<br>
改札外: 平河町方面改札～地上（都道府県会館）<br>
エレベーターのある出入口: エレベーター専用口のみ</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ半蔵門線（永田町駅）・東京メトロ南北線（永田町駅）<br>
徒歩乗り継ぎ: 東京メトロ銀座線（赤坂見附駅）・東京メトロ丸ノ内線（赤坂見附駅）</p>
