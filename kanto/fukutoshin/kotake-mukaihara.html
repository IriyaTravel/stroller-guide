<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>和光市方面は<strong>9号車付近</strong></li><li>渋谷方面は<strong>9号車付近</strong></li></ul>
<p>改札内: 1・2番線ホーム（新木場寄り）～小竹町・向原方面改札／3・4番線ホーム（新木場寄り）～小竹町・向原方面改札<br>
改札外: 小竹町・向原方面改札～3番出入口<br>
エレベーターのある出入口: 3番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ有楽町線（小竹向原駅）・同一ホーム・西武有楽町線（小竹向原駅）</p>
