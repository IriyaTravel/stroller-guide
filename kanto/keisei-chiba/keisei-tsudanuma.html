<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>京成津田沼方面は<strong>4号車付近</strong></li><li>千葉中央方面は<strong>3号車付近</strong></li></ul>
<p>改札内: コンコース（2F）〜1・2番線ホーム／コンコース（2F）〜3・4番線ホーム<br>
改札外: 北口（1F）〜コンコース（2F）<br>
エレベーターのある出入口: 北口番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 本線（京成津田沼駅）・松戸線（京成津田沼駅）</p>
