<h2>この駅で降りる</h2>
<p>エレベーターで降りるには</p>
<ul><li>大門・両国方面は<strong>5号車付近</strong>（確認中）</li><li>新宿・光が丘方面は<strong>5号車付近</strong>（確認中）</li></ul>
<p>改札内: ホーム〜改札<br>
改札外: 改札階〜銀座線改札階（六本木方）／改札階〜地下1階（国立競技場方）／地下1階〜5番出入口<br>
エレベーターのある出入口: 5番出入口</p>
<h2>この駅で乗り換える</h2>
<p>乗り換え: 東京メトロ銀座線（青山一丁目駅）・東京メトロ半蔵門線（青山一丁目駅）</p>
